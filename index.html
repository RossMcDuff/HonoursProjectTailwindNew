<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>
<body class="bg-ink font-sans text-cream antialiased">
<header id="nav"></header>
<main>
  <section id="hero" class="relative h-[70vh] min-h-[420px] overflow-hidden bg-panel"></section>
  <section class="mx-auto max-w-7xl px-4 pt-10"><h2 class="mb-4 font-display text-2xl">Trending this week</h2><div id="trending" class="no-scrollbar flex snap-x gap-4 overflow-x-auto pb-2"></div></section>
  <section class="mx-auto max-w-7xl px-4 pt-10"><h2 class="mb-4 font-display text-2xl">Now playing</h2><div id="nowPlaying" class="no-scrollbar flex snap-x gap-4 overflow-x-auto pb-2"></div></section>
  <section class="mx-auto max-w-7xl px-4 pt-10"><h2 class="mb-4 font-display text-2xl">Top rated</h2><div id="topRated" class="no-scrollbar flex snap-x gap-4 overflow-x-auto pb-2"></div></section>
</main>
<div id="modal"></div>
<footer id="foot"></footer>
<script src="app.js"></script>
<script>
shell('index.html');
async function fillRow(id, path) {
  const el = document.getElementById(id);
  el.innerHTML = skeleton(8, 'w-40 shrink-0');
  try { const d = await api(path); el.innerHTML = d.results.filter(m => m.poster_path).slice(0, 14).map(m => card(m, true)).join(''); }
  catch { el.innerHTML = errorBox; }
}
fillRow('trending', 'trending/movie/week'); fillRow('nowPlaying', 'movie/now_playing'); fillRow('topRated', 'movie/top_rated');
api('movie/popular').then(d => {
  const pool = d.results.filter(x => x.backdrop_path).slice(0, 6), m = pool[Math.floor(Math.random() * pool.length)];
  cache[m.id] = m;
  $('#hero').innerHTML = `<img src="${IMG}w1280${m.backdrop_path}" alt="" class="absolute inset-0 h-full w-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-ink via-ink/50 to-transparent"></div><div class="absolute inset-0 bg-gradient-to-r from-ink/80 to-transparent"></div>
    <div class="relative mx-auto flex h-full max-w-7xl flex-col justify-end px-4 pb-12">
      <h1 class="max-w-3xl font-display text-5xl font-semibold leading-none sm:text-7xl">${esc(m.title)}</h1>
      <p class="mt-4 flex gap-5 text-cream/80"><span>${(m.release_date || '').slice(0, 4)}</span><span class="text-gold">★ ${m.vote_average.toFixed(1)}</span></p>
      <p class="mt-3 line-clamp-3 max-w-xl text-lg text-cream/80">${esc(m.overview)}</p>
      <div class="mt-6 flex flex-wrap gap-3"><button data-open="${m.id}" class="rounded-full bg-gold px-6 py-3 font-semibold text-ink hover:brightness-110">View details</button>
      <button data-fav="${m.id}" aria-pressed="${Fav.has(m.id)}" class="rounded-full border border-cream/40 px-6 py-3 hover:border-gold"><span data-favtext="${m.id}">${favText(m.id)}</span></button></div></div>`;
}).catch(() => { $('#hero').innerHTML = `<div class="grid h-full place-items-center">${errorBox}</div>`; });
</script>
</body>
</html>
